name: Check Medium Articles

on:
  schedule:
    # Tiap 12 jam: 12:00 & 00:00 WITA (UTC+8) => 04:00 & 16:00 UTC.
    # GitHub Actions cron selalu UTC.
    - cron: '0 4,16 * * *'
  workflow_dispatch:        

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: echo "Running at $(date)"

      - run: node check.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}